version: 1.0
configuration:
    has_webserver: true
    readonly_paths:
        - backend/scripts/**
        - backend/wallet_backend/settings.py
        - frontend/vite.config.js
    ide_config:
        default_open_files:
            - backend/wallet_backend/urls.py
            - frontend/src/App.jsx
        project_menu:
            run: bun start
            install: bun install && bash setup.sh --seed
